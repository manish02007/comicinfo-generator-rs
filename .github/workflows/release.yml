# ────────────────────────────────────────────────────────────────────────────
# Release — triggered by pushing a vX.Y.Z tag.
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Produces and uploads to a GitHub Release:
#   • comicinfo-generator-rs-windows-x64.exe
#   • comicinfo-generator-rs-linux-x64.tar.gz
#   • comicinfo-generator-rs-linux-x64.deb     (Debian / Ubuntu)
#   • comicinfo-generator-rs-linux-x64.rpm     (Fedora / RHEL / openSUSE)
#   • comicinfo-generator-rs-macos-x64.tar.gz
#   • comicinfo-generator-rs-macos-arm64.tar.gz
# ────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BIN: comicinfo-generator

permissions:
  contents: write # needed to create GitHub Releases

# ── Windows ──────────────────────────────────────────────────────────────────
jobs:
  build-windows:
    name: Windows x64 (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Rename artifact
        run: |
          cp target/x86_64-pc-windows-msvc/release/${{ env.BIN }}.exe `
             ${{ env.BIN }}-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ${{ env.BIN }}-windows-x64.exe

  # ── Linux ─────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux x64 (.tar.gz + .deb + .rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev pkg-config libglib2.0-dev \
            rpm                          # rpmbuild needed by cargo-generate-rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      # ── .tar.gz ──────────────────────────────────────────────────────────
      - name: Package tar.gz
        run: |
          cp target/x86_64-unknown-linux-gnu/release/${{ env.BIN }} .
          tar -czf ${{ env.BIN }}-linux-x64.tar.gz ${{ env.BIN }} README.md
          rm ${{ env.BIN }}

      # ── .deb ─────────────────────────────────────────────────────────────
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        run: |
          cargo deb --target x86_64-unknown-linux-gnu --no-build
          # cargo-deb puts the file in target/x86_64-unknown-linux-gnu/debian/
          DEB=$(ls target/x86_64-unknown-linux-gnu/debian/*.deb | head -1)
          cp "$DEB" ${{ env.BIN }}-linux-x64.deb

      # ── .rpm ─────────────────────────────────────────────────────────────
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build .rpm package
        run: |
          # generate-rpm reads the binary from target/release, so symlink it
          mkdir -p target/release
          cp target/x86_64-unknown-linux-gnu/release/${{ env.BIN }} \
             target/release/${{ env.BIN }}
          cargo generate-rpm --target x86_64-unknown-linux-gnu
          RPM=$(ls target/x86_64-unknown-linux-gnu/generate-rpm/*.rpm | head -1)
          cp "$RPM" ${{ env.BIN }}-linux-x64.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            ${{ env.BIN }}-linux-x64.tar.gz
            ${{ env.BIN }}-linux-x64.deb
            ${{ env.BIN }}-linux-x64.rpm

  # ── macOS ─────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (${{ matrix.label }}) .tar.gz
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            label: x64
          - target: aarch64-apple-darwin
            label: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tar.gz
        run: |
          cp target/${{ matrix.target }}/release/${{ env.BIN }} .
          tar -czf ${{ env.BIN }}-macos-${{ matrix.label }}.tar.gz \
              ${{ env.BIN }} README.md
          rm ${{ env.BIN }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.label }}
          path: ${{ env.BIN }}-macos-${{ matrix.label }}.tar.gz

  # ── Create GitHub Release ─────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed to diff against the previous tag

      # Download all artifacts built above into ./dist/
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      # Extract version from tag (strips the leading "v")
      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ── Categorized changelog from Conventional Commits ──────────────────
      # Reads every commit message since the previous tag and buckets it by
      # its prefix: feat / fix / perf / refactor / test / docs / chore /
      # other. Write commits like:
      #   feat: add dry-run preview mode
      #   fix: correct counter race condition in worker
      #   chore: bump eframe to 0.29
      #
      # Scans the FULL commit body (%B), not just the subject (%s): a
      # single commit can carry several conventional-commit lines stacked
      # in its body (e.g. a squashed commit), and %s alone only ever sees
      # the first one. Every line in %B that looks like "type: ..." is
      # picked up individually, wherever in the commit message it lives.
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE=""
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          BODY=$(git log $RANGE --pretty=format:"%B")
          SUBJECTS=$(git log $RANGE --pretty=format:"%s")

          KNOWN_TYPES='(feat|fix|perf|refactor|test|docs|chore|ci|build|style)'
          GENERIC='^[a-zA-Z0-9_-]+(\(.+\))?!?:'

          FEATURES=$(echo "$BODY" | grep -E '^feat(\(.+\))?!?:' || true)
          FIXES=$(echo "$BODY" | grep -E '^fix(\(.+\))?!?:' || true)
          PERF=$(echo "$BODY" | grep -E '^perf(\(.+\))?!?:' || true)
          REFACTOR=$(echo "$BODY" | grep -E '^refactor(\(.+\))?!?:' || true)
          TESTS=$(echo "$BODY" | grep -E '^test(\(.+\))?!?:' || true)
          DOCS=$(echo "$BODY" | grep -E '^docs(\(.+\))?!?:' || true)
          CHORE=$(echo "$BODY" | grep -E '^(chore|ci|build|style)(\(.+\))?!?:' || true)

          # Anything left: conventional-style body lines of a type outside
          # the known set above, plus whole commits whose subject never
          # followed the convention at all (merge commits, "wip", ...).
          # NON_CONVENTIONAL_SUBJECTS is restricted to subjects with no
          # colon-prefix at all, since any subject that DOES have one is
          # already present as the first line of BODY and would otherwise
          # be double-counted here.
          OTHER_LINES=$(echo "$BODY" | grep -E "$GENERIC" | grep -vE "^${KNOWN_TYPES}(\(.+\))?!?:" || true)
          NON_CONVENTIONAL_SUBJECTS=$(echo "$SUBJECTS" | grep -vE "$GENERIC" || true)
          OTHERS=$(printf '%s\n%s\n' "$OTHER_LINES" "$NON_CONVENTIONAL_SUBJECTS" | sed '/^$/d')

          # Strip the "type:" / "type(scope):" / "type!:" prefix, capitalize first letter
          clean() {
            sed -E 's/^[a-zA-Z]+(\([^)]+\))?!?: ?//' | sed -E 's/^(.)/\U\1/'
          }

          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"

          if [ -n "$FEATURES" ]; then
            echo "### Features" >> "$GITHUB_OUTPUT"
            echo "$FEATURES" | clean | sed 's/^/- /' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$FIXES" ]; then
            echo "### Fixes" >> "$GITHUB_OUTPUT"
            echo "$FIXES" | clean | sed 's/^/- /' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PERF" ]; then
            echo "### Performance" >> "$GITHUB_OUTPUT"
            echo "$PERF" | clean | sed 's/^/- /' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$REFACTOR" ]; then
            echo "### Refactoring" >> "$GITHUB_OUTPUT"
            echo "$REFACTOR" | clean | sed 's/^/- /' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$TESTS" ]; then
            echo "### Tests" >> "$GITHUB_OUTPUT"
            echo "$TESTS" | clean | sed 's/^/- /' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$DOCS" ]; then
            echo "### Documentation" >> "$GITHUB_OUTPUT"
            echo "$DOCS" | clean | sed 's/^/- /' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$CHORE" ]; then
            echo "### Chores" >> "$GITHUB_OUTPUT"
            echo "$CHORE" | clean | sed 's/^/- /' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$OTHERS" ]; then
            echo "### Other changes" >> "$GITHUB_OUTPUT"
            echo "$OTHERS" | clean | sed 's/^/- /' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi

          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ComicInfo Generator v${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ${{ steps.changelog.outputs.CHANGELOG }}
          files: dist/*
